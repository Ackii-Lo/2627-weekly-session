<h2 id="01---where-did-markdown-come-from">01 - Where Did Markdown Come From?</h2>
<p>Markdown was introduced in 2004 by <strong>John Gruber</strong> for people who write for the web. It began as a lightweight way to turn plain text into HTML: people write text that is easy to read, and tools turn it into structured web content.</p>
<p>Its design was inspired by plain-text email. Even before conversion, headings, lists, and links should remain broadly understandable. That readability is why Markdown still works so well for notes and documents today.</p>
<ul>
<li><strong>John Gruber</strong> published the early implementation and syntax description</li>
<li><strong>Aaron Swartz</strong> contributed important ideas, feedback, and testing to the format's design</li>
<li>&quot;Readability first&quot; remains Markdown's most important design principle</li>
</ul>
<p><em>Source: Daring Fireball - Markdown (2004)</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="5" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="02---what-is-markdown-and-why-use-it">02 - What Is Markdown, and Why Use It?</h2>
<p>Markdown is a lightweight markup language. It uses a small number of symbols to represent structure such as headings, lists, and links. A <code>.md</code> file can be opened in an ordinary editor and converted by different tools into web pages, notes, or documents.</p>
<p>Instead of repeatedly adjusting font size and indentation in an interface, Markdown focuses on the hierarchy of the content itself. Write the structure clearly first, then let the tool handle the presentation.</p>
<blockquote>
<p><strong>Markdown is not meant to make writing more complicated. It keeps text simple, readable, and portable.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="03---a-minimal-markdown-file">03 - A Minimal Markdown File</h2>
<p>These few lines already make a complete Markdown note:</p>
<pre><code class="language-markdown"><span class="hljs-section"># My Weekend Plan</span>

<span class="hljs-bullet">-</span> Take a walk in Yinzhou Park
<span class="hljs-bullet">-</span> Have McDonald&#x27;s
</code></pre>
<p><code>#</code> indicates a heading, and <code>-</code> starts an unordered list. Once the file is saved as <code>hello.md</code>, it remains a clear plain-text document even without specialised software.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-scope-NpnKsMQS="" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="04---where-can-you-write-markdown">04 - Where Can You Write Markdown?</h2>
<p>Markdown is fundamentally a text-file format, so you can write it in many applications. Each tool has a different focus; choose one based on what you mainly need to do.</p>
<div class="tool-grid">
  <div class="tool-card">
    <img src="assets/software-icons/vscode.png" alt="VS Code icon" />
    <div><strong>VS Code</strong><span>Great for learning, project documentation, and file management</span></div>
  </div>
  <div class="tool-card">
    <img src="assets/software-icons/typora.png" alt="Typora icon" />
    <div><strong>Typora</strong><span>Ideal for personal writing with a live formatted preview</span></div>
  </div>
  <div class="tool-card">
    <img src="assets/software-icons/obsidian.png" alt="Obsidian icon" />
    <div><strong>Obsidian</strong><span>Useful for building a long-term personal knowledge base with links</span></div>
  </div>
  <div class="tool-card">
    <img src="assets/software-icons/github.svg" alt="GitHub icon" />
    <div><strong>GitHub Web Editor</strong><span>Useful for editing documentation directly in an open-source project</span></div>
  </div>
</div>
<p>Whichever tool you use, the syntax is the same. You do not need to rewrite your content when you switch tools.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="05---markdown-in-everyday-life-and-projects">05 - Markdown in Everyday Life and Projects</h2>
<p>The most common example is the <code>README.md</code> file in the root directory of a GitHub repository. It usually explains what a project is, how to install and use it, and where to report problems.</p>
<ul>
<li>Course notes, lab records, and personal knowledge bases</li>
<li><code>README.md</code> files, contribution guides, and changelogs for open-source projects</li>
<li>Technical blogs, online documentation, and team collaboration guides</li>
<li>Methods, formulas, and result explanations in data-analysis reports</li>
</ul>
<p>When you need others to understand content quickly, Markdown is often clearer than a large block of plain text.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="06---using-vs-code-today">06 - Using VS Code Today</h2>
<p>In VS Code, create a file and save it as <code>hello.md</code> to start writing Markdown. The built-in preview updates as you edit, so no extra Markdown extension is required.</p>
<ul>
<li>macOS: <code>Cmd + Shift + V</code> opens the preview</li>
<li>Windows / Linux: <code>Ctrl + Shift + V</code> opens the preview</li>
<li>macOS: press <code>Cmd + K</code>, then <code>V</code>, to open a side-by-side preview</li>
<li>Windows / Linux: press <code>Ctrl + K</code>, then <code>V</code>, to open a side-by-side preview</li>
</ul>
<p>One side shows the source file and the other shows what readers see. Viewing both at once is the fastest way to learn Markdown.</p>
<blockquote>
<p>An online editor is available for participants who have not installed VS Code: <a href="https://md.harleyblog.cn/">https://md.harleyblog.cn/</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="activities" data-theme="cpu" lang="C" class="activities" data-marpit-pagination="10" style="--paginate:true;--class:activities;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="exercise-01---create-your-first-markdown-file">Exercise 01 - Create Your First Markdown File</h2>
<h3 id="task">Task</h3>
<ul>
<li>Create a file named <code>hello.md</code></li>
<li>Type a heading beginning with <code>#</code></li>
<li>Write one thing you want to accomplish today beneath the heading</li>
</ul>
<h3 id="check">Check</h3>
<ul>
<li>Does the filename end in <code>.md</code>?</li>
<li>Is there one space after <code>#</code>?</li>
<li>Can a reader understand your heading at a glance?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="yellow" data-theme="cpu" lang="C" class="yellow" data-marpit-pagination="11" style="--paginate:true;--class:yellow;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="part-02">PART 02</h2>
<h3 id="02">02</h3>
<h4 id="text-structure-and-lists">Text Structure and Lists</h4>
<p>Establish the hierarchy first, then add the details</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="07---headings-and-paragraphs">07 - Headings and Paragraphs</h2>
<p>Headings show the hierarchy of content. The fewer <code>#</code> symbols you use, the higher the heading level. A short article usually begins with one level-one heading, then uses level-two and level-three headings to organise topics.</p>
<pre><code class="language-markdown"><span class="hljs-section"># Level-one heading: the subject of the whole note</span>
<span class="hljs-section">## Level-two heading: a main section</span>
<span class="hljs-section">### Level-three heading: a point within that section</span>
</code></pre>
<p>Leave one blank line between paragraphs. A normal line break usually does not begin a new paragraph; to force a line break within the same paragraph, leave two spaces at the end of the line.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="activities" data-theme="cpu" lang="C" class="activities" data-marpit-pagination="13" style="--paginate:true;--class:activities;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="08---lists-and-steps">08 - Lists and Steps</h2>
<p>Use an unordered list when items have no fixed order; use an ordered list when their order cannot be changed. Lists turn a large paragraph into easy-to-scan points.</p>
<pre><code class="language-markdown"><span class="hljs-bullet">-</span> An unordered list
<span class="hljs-bullet">-</span> Works well for listing your ideas

<span class="hljs-bullet">1.</span> An ordered sequence
<span class="hljs-bullet">2.</span> Works well for procedures
<span class="hljs-bullet">   -</span> Indent a sub-item by three spaces
</code></pre>
<p>Unordered lists are useful for tasks, features, and materials. Ordered lists work well for procedures, timelines, and checklists.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="activities" data-theme="cpu" lang="C" class="activities" data-marpit-pagination="14" style="--paginate:true;--class:activities;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="exercise-02---headings-paragraphs-and-lists">Exercise 02 - Headings, Paragraphs, and Lists</h2>
<h3 id="task-1">Task</h3>
<ul>
<li>Write <code>My Weekend</code> using <code>##</code></li>
<li>Write two sentences with one blank line between them</li>
<li>Use <code>-</code> to list three things you would like to do</li>
<li>Use <code>1.</code> to write a three-step weekend plan</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="yellow" data-theme="cpu" lang="C" class="yellow" data-marpit-pagination="15" style="--paginate:true;--class:yellow;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="part-03">PART 03</h2>
<h3 id="03">03</h3>
<h4 id="common-formatting">Common Formatting</h4>
<p>Let's make our content richer</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="09---emphasis-links-and-code">09 - Emphasis, Links, and Code</h2>
<p>Inline formatting helps readers spot keywords, supplementary information, and filenames. It should make important content easier to find, rather than making the whole page stand out.</p>
<pre><code class="language-markdown"><span class="hljs-strong">**Important information**</span>
<span class="hljs-emphasis">*Supplementary note*</span>
[<span class="hljs-string">Visit example</span>](<span class="hljs-link">https://example.com</span>)
<span class="hljs-code">`hello.md`</span>
</code></pre>
<p><code>**text**</code> highlights a key conclusion, <code>*text*</code> adds a supplementary note, <code>[label](URL)</code> creates a link, and backticks are commonly used for filenames, commands, and short code fragments.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="17" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="10---quotations-images-and-tables">10 - Quotations, Images, and Tables</h2>
<p>Use <code>&gt;</code> for a reminder, quotation, or conclusion that deserves separate attention. Insert an image with <code>![description](path)</code>; the description should tell readers what it conveys.<br />
Tables compare a small amount of information side by side. For a simple vertical sequence, a list is usually clearer.</p>
<pre><code class="language-markdown">| Tool | Best for |
| --- | --- |
| Markdown | Writing content |
| Text editor | Editing files |
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="11---horizontal-rules">11 - Horizontal Rules</h2>
<p>A horizontal rule separates different topics or stages in a document. Enter three or more identical symbols on their own line to create one.</p>
<pre><code class="language-text">Content above

Horizontal rule: --- (when writing it, keep only the three hyphens)

Content below
</code></pre>
<p>When you write one, keep only the symbols on the line. <code>---</code>, <code>***</code>, and <code>___</code> produce the same result.</p>
<ul>
<li>The symbols must occupy their own line</li>
<li>Leave a blank line before and after the rule for a clearer structure</li>
<li>Use rules between chapters or major topics; do not overuse them</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="activities" data-theme="cpu" lang="C" class="activities" data-marpit-pagination="19" style="--paginate:true;--class:activities;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="exercise-03---choose-the-right-form-of-expression">Exercise 03 - Choose the Right Form of Expression</h2>
<h3 id="task-2">Task</h3>
<ul>
<li>Use <code>**bold**</code> to highlight one keyword</li>
<li>Use <code>&gt;</code> to write a reminder you like</li>
<li>Add a link to a webpage you want to visit</li>
<li>Use a table to create a morning and afternoon schedule</li>
<li>Use a horizontal rule to separate the schedule from the reminder</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-P0ml5HFN="" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="12---mathematical-notation-inline-and-display-math">12 - Mathematical Notation: Inline and Display Math</h2>

<p>Markdown commonly uses LaTeX-style syntax for mathematical notation. Whether the notation renders depends on the reading tool; in VS Code, check the result in the preview pane on the right.</p>
<h3 id="inline-math">Inline math</h3>
<p>Wrap a short expression in one pair of <code>$</code> symbols to keep it in the same line as a sentence:</p>
<pre><code class="language-markdown">The mass-energy equation is $E = mc^2$, where $c$ is the speed of light.
</code></pre>
<h3 id="display-math">Display math</h3>
<p>For a longer equation or one that needs emphasis, use two pairs of <code>$$</code> on separate lines:</p>
<pre><code class="language-markdown">$$
x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}
$$
</code></pre>
<p><em>Opening and closing delimiters must be paired. For display math, place each <code>$$</code> on its own line.</em></p>
</section>

<h2 id="exercise-04---write-a-mathematical-expression">Exercise 04 - Write a Mathematical Expression</h2>
<h3 id="basics">Basics</h3>
<ul>
<li>Write a sentence containing inline math: <code>The area of a circle is $S = \pi r^2$</code></li>
<li>Use display math to write the Pythagorean theorem: <code>a^2 + b^2 = c^2</code></li>
</ul>
<h3 id="practice">Practice</h3>
<ul>
<li>Write the mean of three numbers: <code>\frac{a+b+c}{3}</code></li>
<li>Write a square root: <code>\sqrt{9} = 3</code></li>
</ul>
<h3 id="check-1">Check</h3>
<ul>
<li>Are <code>$</code> and <code>{}</code> correctly paired?</li>
<li>Does the preview display a formula rather than the source code?</li>
</ul>
</section>

<h2 id="14---images-insertion-and-alt-text">14 - Images: Insertion and Alt Text</h2>

<p>Standard Markdown inserts an image with <code>![alt text](image path)</code>. Alt text appears when an image cannot load and helps readers understand what the image shows.</p>
<pre><code class="language-markdown">![<span class="hljs-string">Ginkgo trees on campus</span>](<span class="hljs-link">assets/ginkgo.jpg</span>)
![<span class="hljs-string">Markdown logo</span>](<span class="hljs-link">https://example.com/markdown.png</span>)
</code></pre>

<td>Indicates an image</td>
<td>Must come first</td>
</tr>
<tr>
<td><code>[]</code></td>
<td>Holds alt text describing the image</td>
<td><code>Ginkgo trees on campus</code></td>
</tr>
<tr>
<td><code>()</code></td>
<td>Holds the image path or URL</td>
<td><code>assets/ginkgo.jpg</code></td>
</tr>
</tbody>
</table>
<p><em>If an image does not load, first check the file name, folder name, and path.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-Ygyvlvfu="" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="15---images-paths-and-links">15 - Images: Paths and Links</h2>

<p>Local images are usually referenced with relative paths. Keeping them in a dedicated folder makes a Markdown project easier to organise and share.</p>
<pre><code class="language-markdown">![<span class="hljs-string">Course cover</span>](<span class="hljs-link">assets/cover.png</span>)
![<span class="hljs-string">Flowchart</span>](<span class="hljs-link">../images/flowchart.png</span>)
[<span class="hljs-string">![Project home</span>](<span class="hljs-link">assets/logo.png</span>)](<span class="hljs-link">https://example.com</span>)
</code></pre>
<ul>
<li><code>photo.png</code>: the image and Markdown file are in the same folder</li>
<li><code>assets/photo.png</code>: the image is in the current folder's <code>assets</code> subfolder</li>
<li><code>../images/photo.png</code>: move up one folder, then into <code>images</code></li>
<li><code>[![...](...)](URL)</code>: makes an image clickable and links to a webpage</li>
</ul>
<blockquote>
<p><strong>Tip:</strong> Use brief, accurate alt text and keep course images together in an <code>assets</code> folder.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="activities" data-theme="cpu" lang="C" class="activities" data-marpit-pagination="25" style="--paginate:true;--class:activities;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="exercise-05---insert-and-describe-an-image">Exercise 05 - Insert and Describe an Image</h2>
<h3 id="task-3">Task</h3>
<ul>
<li>Put an image into the <code>assets</code> folder</li>
<li>Insert it with <code>![a short description](assets/your-image-file.png)</code></li>
<li>Write alt text that clearly describes the image</li>
<li>Optional: wrap the image in a link that opens a related webpage</li>
</ul>
<h3 id="check-2">Check</h3>
<ul>
<li>Does it start with <code>!</code>, and are <code>[]</code> and <code>()</code> correctly paired?</li>
<li>Is the image path inside the parentheses <code>(...)</code>?</li>
<li>Would the alt text help someone who cannot see the image?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="yellow" data-theme="cpu" lang="C" class="yellow" data-marpit-pagination="26" style="--paginate:true;--class:yellow;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="part-04">PART 04</h2>
<h3 id="04">04</h3>
<h4 id="practice--review">Practice &amp; Review</h4>
<p>Put the techniques you have learned into one note, then revisit the core ideas</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-class="activities" data-theme="cpu" lang="C" class="activities" data-marpit-pagination="27" style="--paginate:true;--class:activities;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="16---write-a-personal-introduction-card">16 - Write a Personal Introduction Card</h2>
<h3 id="task-4">Task</h3>
<ul>
<li>Use <code>##</code> to write <code>About Me</code></li>
<li>Use an unordered list for your major, interests, and a recent goal</li>
<li>Highlight one item with <code>**bold**</code></li>
<li>Add a link to a website you visit often</li>
</ul>
<h3 id="self-check">Self-check</h3>
<ul>
<li>Is there a space after every <code>#</code>, <code>-</code>, and <code>1.</code>?</li>
<li>Does every link follow the format <code>[label](URL)</code>?</li>
<li>Does each line express only one piece of information?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="cpu" lang="C" data-marpit-pagination="28" style="--paginate:true;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="17---clear-writing-beats-complicated-writing">17 - Clear Writing Beats Complicated Writing</h2>
<pre><code class="language-markdown"><span class="hljs-section">## About Me</span>

<span class="hljs-bullet">-</span> <span class="hljs-strong">**Major**</span>: Computer Science
<span class="hljs-bullet">-</span> Interest: Programming
<span class="hljs-bullet">-</span> Recent goal: [<span class="hljs-string">Learn Markdown</span>](<span class="hljs-link">https://www.markdownguide.org/</span>)
</code></pre>
<ul>
<li>A heading should name the topic; it does not need to be a complete sentence</li>
<li>Try to express only one idea per line</li>
<li>Use meaningful link text instead of pasting bare URLs</li>
<li>Formatting should make reading easier, not show how many symbols you remember</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="todo" data-theme="cpu" lang="C" class="todo" data-marpit-pagination="29" style="--paginate:true;--class:todo;--theme:cpu;" data-marpit-pagination-total="30">
<h2 id="18---summary-and-review">18 - Summary and Review</h2>
<h3 id="core-syntax">Core Syntax</h3>
<ul>
<li>Headings, paragraphs, and ordered or unordered lists give content structure</li>
<li>Bold, italics, links, and inline code highlight important information</li>
<li>Quotations, tables, and horizontal rules organise different kinds of content</li>
<li>Use <code>$...$</code> or <code>$$...$$</code> for math, and <code>![alt text](image path)</code> for images</li>
</ul>
<h3 id="writing-principles">Writing Principles</h3>
<ul>
<li>Decide on the content structure before choosing Markdown syntax</li>
<li>Keep the source clear and readable; use preview when you need to check the result</li>
<li>Use brief, accurate wording so readers can find the key points easily</li>
</ul>
<p>Markdown is about clear structure, not memorising syntax.</p>
</section>
